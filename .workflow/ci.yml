name: CI Retraining Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPERIMENT_NAME: "CI Influencer Engagement"
  IMAGE_NAME: "influencer-engagement-model"

jobs:
  retrain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -la MLProject

      - name: Install dependencies
        run: python -m pip install mlflow==2.19.0 pandas==2.3.3 numpy==2.5.4 scikit-learn==1.9.1

      - name: Set MLflow Tracking URI
        run: echo "MLFLOW_TRACKING_URI=file://${GITHUB_WORKSPACE}/mlruns" >> "$GITHUB_ENV"

      - name: Run mlflow project
        run: mlflow run MLProject --env-manager=local --experiment-name "$EXPERIMENT_NAME"

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "import mlflow; r = mlflow.search_runs(experiment_names=['$EXPERIMENT_NAME'], order_by=['attributes.start_time DESC'], max_results=1); print(r.loc[0, 'run_id'])")
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Run ID terbaru: $RUN_ID"

      - name: Download artefak run terbaru
        run: |
          rm -rf artifacts/latest
          mkdir -p artifacts/latest
          python -c "import mlflow; mlflow.artifacts.download_artifacts(run_id='$RUN_ID', dst_path='artifacts/latest')"
          echo "$RUN_ID" > artifacts/latest/run_id.txt
          find artifacts/latest -type f | sort

      - name: Upload artefak (GitHub Actions)
        uses: actions/upload-artifact@v7
        with:
          name: model-artifacts
          path: artifacts/latest/
          if-no-files-found: error

      - name: Simpan artefak ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada artefak."
          else
            git commit -m "CI: simpan artefak model run $RUN_ID"
            git push
          fi

      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "$IMAGE_NAME" \
            --env-manager local
          docker images "$IMAGE_NAME"

      - name: Uji container model
        run: |
          docker run -d --name model-test -p 5001:8080 "$IMAGE_NAME"
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5001/ping > /dev/null; then
              echo "Container siap setelah ${i} percobaan"
              break
            fi
            sleep 3
          done
          curl -sf http://localhost:5001/ping > /dev/null || { echo "Container tidak siap"; docker logs model-test; exit 1; }
          RESPONSE=$(curl -sf -X POST http://localhost:5001/invocations \
            -H "Content-Type: application/json" \
            -d @artifacts/latest/model/serving_input_example.json)
          echo "Respons: $RESPONSE"
          echo "$RESPONSE" | python -c "import sys, json; p = json.load(sys.stdin)['predictions']; assert len(p) > 0; print('Jumlah prediksi:', len(p))"
          docker stop model-test

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Secret DOCKERHUB_USERNAME atau DOCKERHUB_TOKEN belum diisi di Settings repo."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag "$IMAGE_NAME" "$DOCKERHUB_USERNAME/$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME" "$DOCKERHUB_USERNAME/$IMAGE_NAME:${RUN_ID:0:8}"

      - name: Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:latest"
          docker push "$DOCKERHUB_USERNAME/$IMAGE_NAME:${RUN_ID:0:8}"
